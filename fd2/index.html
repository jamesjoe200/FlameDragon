<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>炎龍騎士團 II — Flame Dragon Knights II</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
    #app { position: relative; }
    #game-canvas { display: block; image-rendering: pixelated; }
    #editor-panel {
      position: absolute; top: 0; right: -320px; width: 310px; height: 100%;
      background: rgba(10,10,20,0.97); color: #e0e0e0; padding: 12px;
      border-left: 2px solid #444; overflow-y: auto; font-size: 13px;
      transition: right 0.25s ease;
    }
    #editor-panel.open { right: 0; }
    #editor-toggle {
      position: absolute; top: 8px; right: 8px; z-index: 10;
      background: #222; color: #f90; border: 1px solid #f90;
      padding: 4px 10px; cursor: pointer; font-size: 12px; border-radius: 3px;
    }
    #editor-toggle:hover { background: #f90; color: #000; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <button id="editor-toggle">⚙ Editor</button>
    <div id="editor-panel"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
